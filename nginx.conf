server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Keep opaque link references and profile URLs out of access logs.
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { default_type text/plain; return 200 "ok"; }
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_no_cache 1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
